name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy tradinglib

      - name: Run tests
        run: uv run pytest

      - name: Verify MODELS.md is up to date
        run: |
          uv run python scripts/regenerate_models_index.py
          git diff --exit-code MODELS.md || (echo "MODELS.md is stale — run scripts/regenerate_models_index.py locally" && exit 1)
