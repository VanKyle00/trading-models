[project]
name = "trading-models"
version = "0.1.0"
description = "A growing portfolio of trading models — data ingestion, backtesting, and signal research across equities and crypto."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Van" }]

dependencies = [
    "polars>=1.0",
    "pandas>=2.2",
    "duckdb>=1.0",
    "numpy>=2.0",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "matplotlib>=3.9",
    "plotly>=5.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
ingest = [
    "yfinance>=0.2",
    "httpx>=0.27",
    "praw>=7.7",
]
ml = [
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "statsmodels>=0.14",
]
dl = [
    "torch>=2.3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbconvert>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tradinglib"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "data/raw", "data/processed"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = ["data/", "notebooks/", "models/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
