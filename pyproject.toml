[project]
name = "trading-models"
version = "0.1.0"
description = "A growing portfolio of trading models — data ingestion, backtesting, and signal research across equities and crypto."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Van" }]

dependencies = [
    # Core data + viz stack
    "polars>=1.0",
    "pandas>=2.2",
    "duckdb>=1.0",
    "numpy>=2.0",
    "pyarrow>=16.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "plotly>=5.0",
    # Config / serialization
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "joblib>=1.4",
    # Frontend
    "streamlit>=1.40",
    # Web GUI (FastAPI workbench — runs alongside Streamlit)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # Data loaders the seed models import unconditionally
    "yfinance>=0.2",
    "httpx>=0.27",
    "pytrends>=4.9.2",
    # ML the seed models import unconditionally
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    # LLM assistant (provider-swappable; Claude is the default backend)
    "anthropic>=0.69",
    # Sentiment tool sources (RSS feeds + Reddit) — free/keyless except Reddit OAuth
    "feedparser>=6.0",
    "praw>=7.7",
]

[project.optional-dependencies]
# Heavy or follow-up-only deps stay opt-in so the base install
# (and the Streamlit Cloud deploy) stays lean.
ml-extra = [
    "lightgbm>=4.0",
    "statsmodels>=0.14",
]
dl = [
    "torch>=2.3",  # ~1 GB install; only needed for future neural-net models
]
train = [
    # Local QLoRA fine-tuning on the RTX 5080 in WSL2 (CUDA 12.8+). NOT installed
    # in the base or Modal-serving env. Unsloth is the primary trainer; install it
    # per its WSL2/Blackwell instructions (see docs/training-assistant.md) - it is
    # intentionally NOT pinned here because its build is CUDA/torch-version
    # specific. transformers/trl/peft/datasets/accelerate are the stable core.
    "torch>=2.4",
    "transformers>=4.46",
    "trl>=0.12",
    "peft>=0.13",
    "datasets>=3.0",
    "accelerate>=1.0",
    "bitsandbytes>=0.44",  # TRL/bnb fallback path; Unsloth bundles its own kernels
]
deploy = [
    "modal>=0.66",  # serverless host for the FastAPI workbench (see deploy/modal_app.py)
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbconvert>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tradinglib"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "data/raw", "data/processed"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = ["data/", "notebooks/", "models/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
